[package]
name = "effiqueue"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "The queue autoscaler that knows your machine's capacity — a single-binary, cross-platform worker autoscaler driven by measured throughput and a live RAM budget."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mysma-9403/effiQueue"
homepage = "https://github.com/mysma-9403/effiQueue"
documentation = "https://docs.rs/effiqueue"
readme = "README.md"
keywords = ["autoscaler", "rabbitmq", "queue", "worker", "supervisor"]
categories = ["command-line-utilities"]
exclude = [".github/", ".idea/", "target/"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "net", "io-util"] }
lapin = "2.3.1"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shell-words = "1"
thiserror = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

# Smaller, faster release binary.
[profile.release]
lto = true
codegen-units = 1
strip = true
