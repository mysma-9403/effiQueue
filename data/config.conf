[program:messenger_consume_index_site]
    command=php /var/www/symfony/bin/console messenger:consume index_site --time-limit=3600
    process_name=consumer_%(process_num)02d
    # Tryb kontrolera: threshold (prosty próg głębokości) | slo (Budget-Bound SLO Controller).
    mode=threshold
    max_workers=6
    min_workers=0
    poll_interval=10s
    drain_timeout=30s
    shell=false
    # Ustawione, więc `--mode slo` zadziała bez zmian pliku:
    slo_drain_time=120s
    ram_headroom=2GB
    # 'max' jest przestarzały (mapowany na max_workers z ostrzeżeniem):
    max=75
    autostart=true
    autorestart=true
    queue=rabbitmq
    queue_connection=amqp://guest:guest@localhost:5678
    queue_name=messages_low
