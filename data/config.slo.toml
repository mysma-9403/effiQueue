# Example of SLO mode (Budget-Bound SLO Controller + Feasibility Gap).
# Run:  effiqueue --config data/config.slo.toml

mode = "slo"

command = "php /var/www/symfony/bin/console messenger:consume index_site --time-limit=3600"
process_name = "consumer_%(process_num)02d"

# Declared goal: drain the backlog within this time (the operator's main knob).
slo_drain_time = "120s"

# Exactly ONE of ram_budget / ram_headroom (here: an absolute RAM budget for the pool).
ram_budget = "8GB"

min_workers = 0
max_workers = 12
poll_interval = "10s"
drain_timeout = "30s"
shell = false

# Estimator and controller tuning (optional — defaults shown).
alpha_mu = 0.3
alpha_lambda = 0.3
hysteresis = 1
cooldown_ticks = 2
spike_backlog = 1000

# Prometheus metrics endpoint (optional). GET /metrics.
metrics_addr = "127.0.0.1:9101"

queue = "rabbitmq"
queue_connection = "amqp://guest:guest@localhost:5672"
queue_name = "messages_low"

# Preferred source of mu/lambda: the RabbitMQ management API. By default the
# endpoint is derived from queue_connection (same host + credentials, port
# 15672). Set management = false to stay on AMQP only, in which case mu is
# inferred by perturbation regression instead (slower to converge).
management = true
# management_url = "http://guest:guest@localhost:15672"
